name: Check and publish index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - '.github/*.md'
  workflow_dispatch:
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 in Asia/Taipei.
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: read

concurrency:
  group: index-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: |
            .cache/github.json
            .cache/downloads.json
            .cache/endorsements.json
          key: github-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-metadata-
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: validated-index
          path: public/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PUBLISH_INDEX == 'true'
        with:
          path: public/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published catalog, icons and branding without redirects
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        # Pages and its CDN can serve a mix of old and new files for a minute after deploying.
        run: |
          for attempt in 1 2 3; do node scripts/check-published.mjs "${PAGE_URL%/}/index.json" && exit 0; sleep 60; done; exit 1

  cloudflare:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: validated-index
          path: public/
      - name: Deploy to dshopen.org
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Upload and promote a version instead of `wrangler deploy`, so CI never touches the dshopen.org
        # domain binding and the token needs no zone permissions.
        run: |
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx -y wrangler@4.151.1 versions upload --config cloudflare/wrangler.jsonc --tag "$tag"
          npx -y wrangler@4.151.1 versions deploy --config cloudflare/wrangler.jsonc --version-tag "$tag@100" --yes
      - name: Check dshopen.org without redirects
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: for attempt in 1 2 3; do node scripts/check-published.mjs https://dshopen.org/index.json && exit 0; sleep 60; done; exit 1
