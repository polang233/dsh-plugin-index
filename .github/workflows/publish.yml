name: Check and publish index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - '.github/*.md'
  workflow_dispatch:
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 in Asia/Taipei.
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: read

concurrency:
  group: index-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: |
            .cache/github.json
            .cache/downloads.json
            .cache/endorsements.json
          key: github-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-metadata-
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm validate
      - run: pnpm test:browser
      - name: Include domain and certificate verification
        run: |
          mkdir -p public/.well-known/teo-verification
          mkdir -p public/.well-known/pki-validation
          cp site/domain-verification/*.txt public/.well-known/teo-verification/
          cp site/certificate-verification/*.txt public/.well-known/pki-validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: validated-index
          path: public/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PUBLISH_INDEX == 'true'
        with:
          path: public/

  deploy:
    # Keep GitHub Pages on its last release if the Cloudflare upload fails.
    needs: [build, cloudflare]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published catalog, icons and branding without redirects
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        # Pages and its CDN can serve a mix of old and new files for a minute after deploying.
        run: |
          for attempt in 1 2 3; do node scripts/check-published.mjs "${PAGE_URL%/}/index.json" && exit 0; sleep 60; done; exit 1

  maintenance:
    # Keeps one issue listing failing packages and pins that fell behind upstream.
    needs: build
    # Deployment-only fixes can skip issue updates without skipping build or publishing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-maintenance]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: validated-index
          path: public/
      - run: node scripts/check-pins.mjs --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cloudflare:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: validated-index
          path: public/
      - name: Require a Cloudflare deployment token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo '::error::CLOUDFLARE_API_TOKEN is required to publish dshopen.org.'
          exit 1
      - name: Deploy to dshopen.org
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Upload and promote a version instead of `wrangler deploy`, so CI does not change the domain binding.
        # Wrangler may still need permission to read routes and domains when the latest upload came from the dashboard.
        run: |
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node -e 'const s=process.env.DSH_GATEWAY_AUTH_SECRET;if(!s||s.length<32)throw Error("Gateway signing secret missing");require("fs").writeFileSync(process.env.RUNNER_TEMP + "/gateway-secrets.json", JSON.stringify({GATEWAY_AUTH_SECRET:s}))'
          npx -y wrangler@4.151.1 versions upload --config cloudflare/wrangler.jsonc --tag "$tag" --strict --keep-vars --secrets-file "$RUNNER_TEMP/gateway-secrets.json"
          npx -y wrangler@4.151.1 versions deploy --config cloudflare/wrangler.jsonc --version-tag "$tag@100" --yes
        env:
          DSH_GATEWAY_AUTH_SECRET: ${{ secrets.DSH_GATEWAY_AUTH_SECRET }}
      - name: Check dshopen.org without redirects
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: for attempt in 1 2 3; do node scripts/check-published.mjs https://dshopen.polang.workers.dev/index.json && exit 0; sleep 60; done; exit 1

  check-mirrors:
    needs: [deploy, cloudflare]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both published indexes are identical
        run: |
          for attempt in 1 2 3; do
            node scripts/check-mirror-equality.mjs https://dshopen.polang.workers.dev/index.json https://polang233.github.io/dsh-plugin-index/index.json && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1

  edgeone:
    needs: [build, cloudflare, deploy, check-mirrors]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_EDGEONE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: validated-index
          path: public/
      - run: node scripts/package-edgeone.mjs public "$RUNNER_TEMP/edgeone-release"
      - run: node scripts/deploy-edgeone.mjs "$RUNNER_TEMP/edgeone-release"
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: global
          DSH_GATEWAY_AUTH_SECRET: ${{ secrets.DSH_GATEWAY_AUTH_SECRET }}
      - name: Check gateway and immutable release
        run: |
          for attempt in 1 2 3; do
            node scripts/check-published.mjs https://network-probe.dshopen.org/index.json && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
