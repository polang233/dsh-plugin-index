name: 插件收录 / Plugin submission
description: 推荐插件、更正信息或申请移除 / Suggest, correct or remove a listing
title: "[Plugin] "
body:
  - type: input
    id: plugin
    attributes:
      label: 插件地址 / Plugin link
      description: 填写 npm 包名或源码仓库地址即可。 / npm package name or source repository URL.
      placeholder: "@owner/dsh-plugin 或 https://github.com/owner/plugin"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 简短说明 / Summary
      description: 用一句话介绍用途，或说明需要更正、移除的内容。中文或英文均可。 / Briefly describe the plugin or requested change in Chinese or English.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional details
      description: 可选，附上 Logo、截图或实际测试情况。 / Optional logo, screenshots or testing notes.
