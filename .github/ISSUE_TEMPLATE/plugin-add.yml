name: 插件收录 / Add a plugin
description: 推荐新插件或更正已收录信息 / Suggest a plugin or correct a listing
title: "[plugin-add] "
body:
  - type: input
    id: plugin
    attributes:
      label: 插件地址 / Plugin link
      description: 填写 npm 包名或源码仓库地址即可。 / npm package name or source repository URL.
      placeholder: "@owner/dsh-plugin 或 https://github.com/owner/plugin"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 简短说明 / Summary
      description: 用一句话介绍用途，或说明需要更正的内容。中文或英文均可。申请下架请改用「插件下架」模板。 / Briefly describe the plugin or the correction in Chinese or English. To remove a listing, use the "Remove a plugin" form instead.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional details
      description: 可选，附上 Logo、截图或实际测试情况。 / Optional logo, screenshots or testing notes.
