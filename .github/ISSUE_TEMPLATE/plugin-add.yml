name: 插件收录 / Add a plugin
description: 推荐新插件或更正已收录信息 / Suggest a plugin or correct a listing
title: "[plugin-add] "
body:
  - type: markdown
    attributes:
      value: |
        感谢推荐插件！这份索引由社区一点点整理、审核出来，如果它帮你找到过好用的插件，欢迎顺手给项目点个 ⭐ [Star](https://github.com/polang233/dsh-plugin-index)，这是对维护最直接的支持，也能让更多人发现你的插件。
        Thanks for suggesting a plugin! This index is gathered and reviewed by hand. If it has helped you, a ⭐ [star](https://github.com/polang233/dsh-plugin-index) is the simplest way to support it, and helps more people find your plugin too.
  - type: input
    id: plugin
    attributes:
      label: 插件地址 / Plugin link
      description: 填写 npm 包名或源码仓库地址；插件位于子目录时请注明相对路径。 / npm package name or repository URL; include the relative path for a plugin in a subdirectory.
      placeholder: "@owner/dsh-plugin 或 https://github.com/owner/plugin"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 简短说明 / Summary
      description: 用一句话介绍用途，或说明需要更正的内容。中文或英文均可。申请下架请改用「插件下架」模板。 / Briefly describe the plugin or the correction in Chinese or English. To remove a listing, use the "Remove a plugin" form instead.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 插件实际效果 / Plugin screenshots
      description: 可选，拖入 1–6 张真实使用截图，并为每张写一句说明。请勿提交 Logo、装饰边框或广告图；提交前遮盖密钥和个人信息。维护者确认后优先用于插件详情预览。 / Optional. Drop 1–6 screenshots of the plugin in use, each with a short caption. Exclude logos, borders and ads, and redact keys and personal information. Selected images take priority in plugin previews.
      placeholder: "可直接拖入图片，也可粘贴公开的 GitHub 图片链接。 / Drop images here or paste public GitHub image links."
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional details
      description: 可选，附上 Logo、已验证的 DSH 版本、平台或其他测试情况。 / Optional logo, tested DSH versions, platforms or other testing notes.
